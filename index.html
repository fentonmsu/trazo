<!doctype html>

    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Noto Sans Hebrew: most system/default fonts only have GPOS mark-
      attachment anchors for niqqud on the common letterforms, not on the
      sofit (final) ones (מ/נ/פ/צ almost never carry a vowel point in real
      text), so a point combined with ם/ן/ף/ץ silently fails to attach in
      those fonts. Noto's tables cover every letterform, so it's used
      specifically for Hebrew glyphs (see .hebrew-glyph in App.css).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap"
      rel="stylesheet"
    />

  </body>
